[project]
name = "backend"
version = "1.0.0"
description = "Smart Agriculture Backend — FastAPI + scikit-learn 1.6.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "joblib>=1.4,<2",
    "pandas>=2.0,<3",
    "scikit-learn==1.6.1",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
