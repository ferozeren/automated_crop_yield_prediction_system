services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-agri-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WEATHER_CITY=${WEATHER_CITY:-Hyderabad}
    volumes:
      - ./app/models:/app/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: smart-agri-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8000
